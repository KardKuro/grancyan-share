<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<title>GranCyan 分享</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400;1,500&family=JetBrains+Mono:wght@400&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
  /* GranCyan 分享出来的对话：只读快照。数据在 Supabase，凭链接 # 后面的 id 走 get_share 取那一条。
     深色、主题色跟着分享时 App 的 --accent。
     版式参考 muuuuu.org 的作品集站（大字标题 + 留白 + 等宽小标签），首屏背景是 reactbits Aurora 思路的手写 WebGL。 */
  :root {
    --bg:#0b0b0e; --card:#15151a; --line:#26262d; --text:#ebe8e2; --muted:#85838c; --accent:#c89555;
    --serif:'Noto Serif SC', 'Songti SC', SimSun, serif;
    --display:'Cormorant Garamond', 'Noto Serif SC', serif;
    --mono:'JetBrains Mono', ui-monospace, Consolas, monospace;
    --ease-out:cubic-bezier(.22, 1, .36, 1);
    /* 主题色当字色用时提亮一截：深蓝/深紫主题色直接写在黑底上看不清 */
    --accent-ink:color-mix(in oklab, var(--accent) 62%, #fff);
  }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--text); }
  body { font:15px/1.8 var(--serif); -webkit-font-smoothing:antialiased; }
  ::selection { background:color-mix(in srgb, var(--accent) 45%, transparent); }

  /* ── 首屏 ── */
  .hero { position:relative; min-height:78vh; min-height:78svh; display:flex; align-items:flex-end; overflow:hidden; border-bottom:1px solid var(--line); }
  .hero canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  /* 没有 WebGL / 减少动态效果时的静态底 */
  .hero::before { content:''; position:absolute; inset:0;
    background:
      radial-gradient(60% 50% at 25% 15%, color-mix(in srgb, var(--accent) 30%, transparent), transparent 70%),
      radial-gradient(50% 45% at 80% 5%, color-mix(in srgb, var(--accent) 16%, #3a5a8c 20%), transparent 70%); }
  .hero.gl::before { display:none; }
  .hero::after { content:''; position:absolute; inset:auto 0 0; height:45%; background:linear-gradient(transparent, var(--bg)); pointer-events:none; }
  .hero-in { position:relative; z-index:1; width:100%; max-width:1080px; margin:0 auto; padding:0 24px 56px; }
  .kicker { font:11px/1 var(--mono); letter-spacing:.22em; text-transform:uppercase; color:var(--muted); display:flex; gap:12px; align-items:center; }
  .kicker::before { content:''; width:28px; height:1px; background:var(--accent); }
  h1 { margin:22px 0 26px; font:400 clamp(40px, 8.6vw, 104px)/1.08 var(--serif); letter-spacing:-.01em; overflow-wrap:anywhere; }
  h1.long { font-size:clamp(30px, 5.4vw, 64px); }
  h1 .ch { display:inline-block; white-space:pre; }
  .meta { display:flex; flex-wrap:wrap; gap:8px 28px; font:12px/1.4 var(--mono); color:var(--muted); letter-spacing:.06em; }
  .meta b { font-weight:400; color:var(--text); }
  .meta em { font:italic 500 15px/1 var(--display); color:var(--accent-ink); letter-spacing:0; }
  .vert { position:absolute; z-index:1; right:22px; top:28px; writing-mode:vertical-rl; font:italic 400 15px/1 var(--display); letter-spacing:.18em; color:var(--muted); }
  .cue { position:absolute; z-index:1; right:24px; bottom:24px; font:10px/1 var(--mono); letter-spacing:.2em; color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:10px; }
  .cue i { width:1px; height:44px; background:linear-gradient(var(--muted), transparent); transform-origin:top; animation:cue 2.4s var(--ease-out) infinite; }
  @keyframes cue { 0% { transform:scaleY(0); } 50% { transform:scaleY(1); } 100% { transform:scaleY(1); opacity:0; } }

  /* ── 对话 ── */
  .wrap { max-width:760px; margin:0 auto; padding:48px 16px 40px; }
  .day { display:flex; align-items:baseline; gap:14px; margin:56px 0 22px; }
  .day:first-child { margin-top:8px; }
  .day b { font:italic 400 40px/1 var(--display); color:var(--text); }
  .day span { font:11px/1 var(--mono); letter-spacing:.14em; color:var(--muted); }
  .day::after { content:''; flex:1; height:1px; background:var(--line); align-self:center; }
  .msg { display:flex; flex-direction:column; align-items:flex-start; margin:22px 0; }
  .msg.u { align-items:flex-end; }
  .who { display:flex; align-items:baseline; gap:10px; font-size:12px; color:var(--muted); margin:0 2px 6px; }
  .who .no { font:10px/1 var(--mono); letter-spacing:.1em; opacity:.7; }
  .who time { font:11px/1 var(--mono); opacity:.8; }
  .msg.a .who .nm { color:var(--accent-ink); }
  .bub { max-width:min(88%, 640px); overflow-wrap:anywhere; }
  /* AI 那侧不套气泡，像正文排版；用户那侧保留色块 */
  .msg.a .bub { max-width:100%; padding:2px 0 2px 16px; border-left:1px solid color-mix(in srgb, var(--accent-ink) 45%, var(--line)); }
  .msg.u .bub { padding:10px 16px; border-radius:16px 16px 4px 16px; background:color-mix(in srgb, var(--accent) 15%, var(--card)); border:1px solid color-mix(in srgb, var(--accent) 34%, var(--line)); }
  .bub > :first-child { margin-top:0; } .bub > :last-child { margin-bottom:0; }
  .bub p { margin:.55em 0; }
  .bub pre { overflow:auto; padding:12px; border-radius:8px; background:#08080a; border:1px solid var(--line); font-size:13px; line-height:1.6; }
  .bub code { font-family:var(--mono); font-size:.88em; }
  .bub blockquote { margin:.6em 0; padding-left:12px; border-left:2px solid var(--accent); color:#cfccc6; }
  .bub img { max-width:100%; }
  .bub a { color:var(--accent-ink); }
  .bub table { border-collapse:collapse; display:block; overflow:auto; }
  .bub th, .bub td { border:1px solid var(--line); padding:4px 8px; }
  .state { min-height:100vh; min-height:100svh; display:flex; align-items:center; justify-content:center; color:var(--muted); font:13px/1 var(--mono); letter-spacing:.08em; }

  footer { max-width:1080px; margin:40px auto 0; padding:0 24px 36px; overflow:hidden; }
  .mark { font:italic 400 clamp(64px, 17vw, 200px)/.9 var(--display); color:transparent; -webkit-text-stroke:1px color-mix(in srgb, var(--accent) 50%, var(--line)); letter-spacing:-.02em; white-space:nowrap; user-select:none; padding-bottom:.2em; }
  .foot { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-top:0; padding-top:14px; border-top:1px solid var(--line); font:11px/1.4 var(--mono); letter-spacing:.08em; color:var(--muted); }

  /* ── 动效：只在 JS 跑起来、且没开「减少动态效果」时才藏起来等着进场 ── */
  .anim h1 .ch { opacity:0; filter:blur(10px); transform:translateY(.35em); animation:chIn .9s var(--ease-out) forwards; animation-delay:calc(var(--i) * 38ms + 120ms); }
  .anim .kicker, .anim .meta { opacity:0; animation:fadeUp .9s var(--ease-out) forwards; }
  .anim .kicker { animation-delay:60ms; }
  .anim .meta { animation-delay:var(--md, 500ms); }
  @keyframes chIn { to { opacity:1; filter:blur(0); transform:none; } }
  @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
  .anim .rv { opacity:0; transform:translateY(22px); filter:blur(4px); transition:opacity .8s var(--ease-out), transform .8s var(--ease-out), filter .8s var(--ease-out); }
  .anim .rv.in { opacity:1; transform:none; filter:none; }
  @media (prefers-reduced-motion: reduce) { .cue i { animation:none; } }

  @media (max-width:640px) {
    .hero { min-height:66vh; min-height:66svh; }
    .hero-in { padding:0 16px 40px; }
    .vert, .cue { display:none; }
    .wrap { padding:32px 16px 28px; }
    .msg.u .bub { max-width:92%; }
    .msg.a .bub { padding-left:12px; }
    .day b { font-size:32px; }
    footer { padding:0 16px 28px; }
  }
</style>
</head>
<body>
<div id="app"><div class="state">LOADING…</div></div>
<script>
(function () {
  var URL_ = 'https://nzgcwyovmoppykvluxvs.supabase.co';
  var KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im56Z2N3eW92bW9wcHlrdmx1eHZzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExNDA5ODksImV4cCI6MjA5NjcxNjk4OX0.p5UceEqX8JkrJjbInxwT97ghqvJSY2kOVbAlBxCfe8Q';
  var app = document.getElementById('app');
  var motion = !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function state(t) { app.innerHTML = '<div class="state">' + esc(t) + '</div>'; }
  // 对话内容是 AI 和人写的任意文字：markdown 渲染完一定过 DOMPurify，库没加载出来就退回纯文本
  function md(t) {
    try { if (window.marked && window.DOMPurify) return DOMPurify.sanitize(marked.parse(String(t), { breaks: true, gfm: true })); } catch (e) {}
    return esc(t).replace(/\n/g, '<br>');
  }
  function okColor(c) { return /^#[0-9a-f]{3,8}$/i.test(c) || /^rgba?\([\d\s,.%]+\)$/i.test(c); }
  function pad(n) { return String(n).padStart(2, '0'); }
  function D(ts) { var d = new Date(ts); return !ts || isNaN(d) ? null : d; }
  function hm(ts) { var d = D(ts); return d ? pad(d.getHours()) + ':' + pad(d.getMinutes()) : ''; }
  var WK = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

  var id = decodeURIComponent((location.hash || '').slice(1));
  if (!/^[A-Za-z0-9]{6,32}$/.test(id)) return state('链接不完整');
  fetch(URL_ + '/rest/v1/rpc/get_share', {
    method: 'POST',
    headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ sid: id })
  }).then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)); }).then(function (s) {
    if (!s || !s.payload) return state('这条分享不存在，或者已经被撤回了');
    render(s);
  }).catch(function (e) { state('加载失败（' + e.message + '），稍后再试'); });

  function render(s) {
    var p = s.payload, msgs = Array.isArray(p.msgs) ? p.msgs : [];
    if (p.accent && okColor(p.accent)) document.documentElement.style.setProperty('--accent', p.accent);
    var title = p.title || '一段对话';
    document.title = title + ' · GranCyan';
    if (motion) document.documentElement.classList.add('anim');

    // 双方名字：用户取 payload.user，AI 取出现过的昵称（最多两个）
    var ai = [];
    msgs.forEach(function (m) { if (m.r !== 'u' && m.n && ai.indexOf(m.n) < 0) ai.push(m.n); });
    var who = esc(p.user || '我') + ' <em>&amp;</em> ' + esc(ai.slice(0, 2).join(' / ') || 'AI');
    var sd = D(s.created_at);

    // 标题拆成单字逐个进场；长标题后面的字统一延迟，别让人干等
    var chars = Array.from(title);
    var h1 = chars.map(function (c, i) { return '<span class="ch" style="--i:' + Math.min(i, 24) + '">' + esc(c) + '</span>'; }).join('');
    var h = '<section class="hero" id="hero"><canvas id="fx" aria-hidden="true"></canvas>'
      + '<div class="vert" aria-hidden="true">GranCyan — shared</div>'
      + '<div class="hero-in"><div class="kicker">Shared conversation · 只读快照</div>'
      + '<h1' + (chars.length > 16 ? ' class="long"' : '') + '>' + h1 + '</h1>'
      + '<div class="meta" style="--md:' + (Math.min(chars.length, 24) * 38 + 420) + 'ms"><b>' + who + '</b><span>' + msgs.length + ' messages</span>'
      + (sd ? '<span>' + sd.getFullYear() + '.' + pad(sd.getMonth() + 1) + '.' + pad(sd.getDate()) + '</span>' : '') + '</div></div>'
      + '<div class="cue" aria-hidden="true">SCROLL<i></i></div></section><main class="wrap">';

    var lastDay = '', no = 0;
    msgs.forEach(function (m) {
      var d = D(m.ts), dk = d ? d.toDateString() : '';
      if (dk && dk !== lastDay) {
        h += '<div class="day rv"><b>' + pad(d.getMonth() + 1) + '.' + pad(d.getDate()) + '</b><span>' + d.getFullYear() + ' · ' + WK[d.getDay()] + '</span></div>';
        lastDay = dk;
      }
      var u = m.r === 'u';
      no++;
      h += '<article class="msg rv ' + (u ? 'u' : 'a') + '"><div class="who"><span class="no">' + pad(no) + '</span><span class="nm">' + esc(m.n || (u ? '我' : 'AI')) + '</span>'
        + (m.ts ? '<time>' + esc(hm(m.ts)) + '</time>' : '') + '</div>'
        + '<div class="bub">' + md(m.t || '') + '</div></article>';
    });
    h += '</main><footer><div class="mark" aria-hidden="true">GranCyan</div>'
      + '<div class="foot"><span>由 GranCyan 分享 · 只读快照</span><span>' + msgs.length + ' messages</span></div></footer>';
    app.innerHTML = h;
    reveal();
    aurora(document.getElementById('hero'), document.getElementById('fx'));
  }

  // 滚到才进场；没有 IntersectionObserver 就直接全亮，不能把字永远藏着
  function reveal() {
    var els = app.querySelectorAll('.rv');
    if (!motion || !('IntersectionObserver' in window)) { els.forEach(function (e) { e.classList.add('in'); }); return; }
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { rootMargin: '0px 0px -6% 0px' });
    els.forEach(function (e) { io.observe(e); });
  }

  // 首屏极光：一张全屏片元着色器，颜色跟主题色走。半分辨率渲染（本来就是糊的，省电），
  // 首屏滚出视野或页面切后台就停帧；减少动态效果时只画一帧静止的。
  function aurora(hero, cv) {
    var gl = cv.getContext('webgl', { antialias: false, alpha: false, powerPreference: 'low-power' });
    if (!gl) return;
    var vs = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
    var fs = [
      'precision mediump float;uniform vec2 R;uniform float T;uniform vec3 A;uniform vec3 B;',
      'float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}',
      'float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);',
      ' return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}',
      'float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<4;i++){v+=a*n(p);p=p*2.03+vec2(1.7,9.2);a*=.5;}return v;}',
      'void main(){vec2 uv=gl_FragCoord.xy/R;vec2 q=vec2(uv.x*R.x/R.y,uv.y);float t=T*.045;',
      ' float w=fbm(vec2(q.x*1.6+t,t*.7));',
      ' float band=exp(-pow((uv.y-.62-w*.38)*3.2,2.));',
      ' float s=fbm(vec2(q.x*2.2+w*1.5+t*1.2,uv.y*2.4-t));',
      ' float k=band*(.35+.8*s*s);',
      ' float w2=fbm(vec2(q.x*1.1-t*.8,4.+t*.5));',
      ' float k2=exp(-pow((uv.y-.85-w2*.25)*4.,2.))*(.3+.7*fbm(vec2(q.x*2.-t+w2,uv.y*2.)));',
      ' vec3 bg=vec3(.043,.043,.055);',
      ' vec3 c=bg+A*k*.85+B*k2*.55;',
      ' c*=smoothstep(0.,.55,uv.y)*.85+.15;',
      ' c+=(h(gl_FragCoord.xy+T)-.5)*.018;',
      ' gl_FragColor=vec4(c,1.);}'
    ].join('\n');
    function sh(type, src) { var o = gl.createShader(type); gl.shaderSource(o, src); gl.compileShader(o); return gl.getShaderParameter(o, gl.COMPILE_STATUS) ? o : null; }
    var v = sh(gl.VERTEX_SHADER, vs), f = sh(gl.FRAGMENT_SHADER, fs);
    if (!v || !f) return;
    var pg = gl.createProgram(); gl.attachShader(pg, v); gl.attachShader(pg, f); gl.linkProgram(pg);
    if (!gl.getProgramParameter(pg, gl.LINK_STATUS)) return;
    gl.useProgram(pg);
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    var loc = gl.getAttribLocation(pg, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    var uR = gl.getUniformLocation(pg, 'R'), uT = gl.getUniformLocation(pg, 'T');

    // 主题色 → 主光带；再配一条偏冷的副光带（主题色往蓝里拉），亮度过低的主题色抬一点
    var acc = rgb(getComputedStyle(document.documentElement).getPropertyValue('--accent')) || [.78, .58, .33];
    var lum = acc[0] * .3 + acc[1] * .59 + acc[2] * .11;
    if (lum < .35) acc = acc.map(function (x) { return Math.min(1, x + (.35 - lum)); });
    gl.uniform3fv(gl.getUniformLocation(pg, 'A'), acc);
    gl.uniform3fv(gl.getUniformLocation(pg, 'B'), [acc[0] * .35 + .12, acc[1] * .45 + .22, acc[2] * .4 + .48]);

    function size() {
      var w = Math.max(1, Math.round(hero.clientWidth * .5)), hh = Math.max(1, Math.round(hero.clientHeight * .5));
      if (cv.width !== w || cv.height !== hh) { cv.width = w; cv.height = hh; gl.viewport(0, 0, w, hh); gl.uniform2f(uR, w, hh); }
    }
    var t0 = performance.now() - 20000, raf = 0, seen = true;
    function frame(now) { raf = 0; size(); gl.uniform1f(uT, (now - t0) / 1000); gl.drawArrays(gl.TRIANGLES, 0, 3); go(); }
    function go() { if (motion && seen && !document.hidden && !raf) raf = requestAnimationFrame(frame); }
    hero.classList.add('gl');
    frame(performance.now());
    if (!motion) { addEventListener('resize', function () { frame(performance.now()); }); return; }
    document.addEventListener('visibilitychange', go);
    if ('IntersectionObserver' in window) new IntersectionObserver(function (es) { seen = es[0].isIntersecting; go(); }).observe(hero);
  }
  // 只认 #rgb / #rrggbb / rgb(a)()，别的一律 null 走默认色
  function rgb(c) {
    c = String(c || '').trim();
    var m = /^#([0-9a-f]{3}|[0-9a-f]{6})([0-9a-f]{2})?$/i.exec(c);
    if (m) { var x = m[1].length === 3 ? m[1].replace(/./g, '$&$&') : m[1]; return [0, 2, 4].map(function (i) { return parseInt(x.substr(i, 2), 16) / 255; }); }
    m = /^rgba?\(\s*([\d.]+)[\s,]+([\d.]+)[\s,]+([\d.]+)/i.exec(c);
    return m ? [m[1], m[2], m[3]].map(function (v) { return Math.min(255, +v) / 255; }) : null;
  }
})();
</script>
</body>
</html>
